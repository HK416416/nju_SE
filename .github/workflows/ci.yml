name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        run: |
          cmake -B build \
                -S . \
                -DCMAKE_BUILD_TYPE=Debug \
                -DENABLE_COVERAGE=ON

      # 🔥 关键：强制重新编译测试文件，避免旧 .gcno 导致行号 mismatch
      - name: Force recompile test files (avoid stale .gcno)
        run: |
          touch tests/TransactionTest.cpp
          # 如果还有其他测试文件，也可以 touch 它们
          # touch tests/BudgetTest.cpp

      - name: Build Project
        run: |
          cd build
          make -j$(nproc) VERBOSE=1

      - name: Run Unit Tests
        run: |
          ./build/bin/FamilyBudgetConsole_UnitTests
          ./build/tests/FamilyBudgetConsole_IntegrationTests

      # 📊 可选：打印源码片段用于调试行号问题
      - name: Debug TransactionTest.cpp lines 50-60
        if: always()
        run: |
          echo "=== TransactionTest.cpp (lines 50-60) ==="
          sed -n '50,60p' tests/TransactionTest.cpp || echo "File not found or too short"
          echo "========================================="

      - name: Generate Coverage Report
        run: |
          # 捕获覆盖率数据，忽略 harmless mismatch 错误
          lcov --capture \
               --directory build \
               --output-file build/coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors mismatch

          # 过滤掉第三方代码、头文件、测试文件等
          lcov --remove build/coverage.info \
               '/usr/*' \
               '*/tests/*' \
               '*/_deps/*' \
               '*/googletest/*' \
               '*/googlemock/*' \
               '*/CMakeFiles/*' \
               '*/main.cpp' \
               --output-file build/coverage_filtered.info \
               --rc branch_coverage=1

          # 生成 HTML 报告
          genhtml build/coverage_filtered.info \
                  --output-directory build/coverage_report \
                  --branch-coverage \
                  --title "FamilyBudgetQt Coverage Report" \
                  --legend

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_report/

      - name: Display coverage summary (optional)
        run: |
          lcov --summary build/coverage_filtered.info