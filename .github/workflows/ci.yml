name: C++ Family Budget System CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'FamilyBudgetQt/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'FamilyBudgetQt/**'

env:
  BUILD_TYPE: Debug
  COVERAGE: true
  WORKING_DIR: FamilyBudgetQt

jobs:
  build-and-test:
    name: Build and Test on Ubuntu
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          make \
          lcov \
          libgtest-dev \
          libgmock-dev
        echo "Dependencies installed successfully"

    # 🔥 关键：彻底清除所有可能的 gcov 残留文件（项目级清理）
    - name: Clean All GCOV Artifacts and Build Directory
      run: |
        find . -name "*.gcda" -delete
        find . -name "*.gcno" -delete
        rm -rf build/
        mkdir build

    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTS=ON \
          -DENABLE_COVERAGE=${{ env.COVERAGE }}

    - name: Build Project
      run: |
        cd build
        make -j$(nproc) VERBOSE=1
        echo "Build completed successfully"

    - name: Run Unit Tests
      run: |
        cd build
        if [ ! -f "tests/FamilyBudgetConsole_UnitTests" ]; then
          echo "❌ Unit test executable not found!"
          exit 1
        fi
        ./tests/FamilyBudgetConsole_UnitTests --gtest_output=xml:unit_test_results.xml
        if [ $? -ne 0 ]; then
          echo "❌ Unit tests failed!"
          exit 1
        fi
        echo "✅ Unit tests passed"

    - name: Run Integration Tests
      run: |
        cd build
        if [ ! -f "tests/FamilyBudgetConsole_IntegrationTests" ]; then
          echo "❌ Integration test executable not found!"
          exit 1
        fi
        ./tests/FamilyBudgetConsole_IntegrationTests --gtest_output=xml:integration_test_results.xml
        if [ $? -ne 0 ]; then
          echo "❌ Integration tests failed!"
          exit 1
        fi
        echo "✅ Integration tests passed"

    - name: Generate Coverage Report
      if: env.COVERAGE == 'true'
      run: |
        echo "Generating coverage report from build/ directory only..."

        # 📌 只从 build/ 目录采集覆盖率数据（避免外部残留干扰）
        # ✅ 关键修改：添加 --ignore-errors mismatch
        lcov --capture \
             --directory build \
             --output-file build/coverage.info \
             --rc branch_coverage=1 \
             --ignore-errors mismatch

        # 过滤掉非业务代码
        lcov --remove build/coverage.info \
             '/usr/*' \
             '/opt/*' \
             '*/tests/*' \
             '*/_deps/*' \
             '*/googletest/*' \
             '*/CMakeFiles/*' \
             '*/main.cpp' \
             --output-file build/coverage_filtered.info \
             --rc branch_coverage=1

        # 生成 HTML 报告
        genhtml build/coverage_filtered.info \
                --output-directory build/coverage_report \
                --branch-coverage

        # 打印摘要
        lcov --list build/coverage_filtered.info --rc branch_coverage=1

        echo "Coverage report generated in build/coverage_report/"

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifacts-ubuntu
        path: |
          ${{ env.WORKING_DIR }}/build/unit_test_results.xml
          ${{ env.WORKING_DIR }}/build/integration_test_results.xml
          ${{ env.WORKING_DIR }}/build/coverage_filtered.info
          ${{ env.WORKING_DIR }}/build/coverage_report/
          ${{ env.WORKING_DIR }}/build/bin/
          ${{ env.WORKING_DIR }}/build/tests/
        retention-days: 7

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "### 🧪 家庭记账本系统测试报告" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "#### 📊 测试状态" >> $GITHUB_STEP_SUMMARY
        echo "- **构建与测试任务**: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build-and-test.result }}" == "success" ]; then
          echo "✅ **所有测试通过！**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **测试失败，请检查日志和测试结果。**" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🔧 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- 构建类型: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
        echo "- 操作系统: Ubuntu" >> $GITHUB_STEP_SUMMARY
        echo "- 工作目录: ${{ env.WORKING_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "- 覆盖率分析: ${{ env.COVERAGE }}" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📁 生成文件" >> $GITHUB_STEP_SUMMARY
        echo "测试完成后生成的文件可在 **Artifacts → ci-artifacts-ubuntu** 中下载：" >> $GITHUB_STEP_SUMMARY
        echo "- 测试结果 XML" >> $GITHUB_STEP_SUMMARY
        echo "- 覆盖率报告（HTML）" >> $GITHUB_STEP_SUMMARY
        echo "- 可执行文件（bin/ 和 tests/）" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*报告生成时间: $(date '+%Y-%m-%d %H:%M:%S %Z')*" >> $GITHUB_STEP_SUMMARY
        echo "*工作流: ${{ github.workflow }}*" >> $GITHUB_STEP_SUMMARY
        echo "*提交: ${{ github.sha }}*" >> $GITHUB_STEP_SUMMARY